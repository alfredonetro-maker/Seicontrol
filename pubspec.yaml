name: seicontrol
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/images/app_logo.jpg"
  web:
    generate: true
    image_path: "assets/images/app_logo.jpg"
    background_color: "#ffffff"
    theme_color: "#0867f9"
  windows:
    generate: true
    image_path: "assets/images/app_logo.jpg"
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/images/
